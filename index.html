<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#131416">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: https:; manifest-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Gym Tracker</title>
<style>
  :root{
    --bg:#131416; --card:#1c1e21; --line:#2b2e33;
    --ink:#eceff1; --mute:#98a0a8; --accent:#f5b301; --accent-ink:#141210;
    --ok:#4cc38a; --danger:#e5484d;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,"Heebo",Arial,sans-serif;
    font-size:16px; padding:14px 12px 150px;
  }
  h1{font-size:15px; letter-spacing:.14em; color:var(--mute); font-weight:600; margin:2px 2px 12px;}
  h1 b{color:var(--accent); letter-spacing:0;}
  .viewtabs{display:flex; gap:6px; margin-bottom:14px;}
  .vtab{flex:1; text-align:center; padding:9px 0; border-radius:11px; font-size:13.5px; font-weight:700;
    background:var(--card); border:1px solid var(--line); color:var(--mute); cursor:pointer; user-select:none;}
  .vtab.on{color:var(--accent); border-color:var(--accent);}
  select{
    background:var(--card); border:1px solid var(--line); border-radius:11px; color:var(--ink);
    font-size:15px; padding:9px 10px; width:100%;
  }
  .next{background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:12px 14px; margin-bottom:12px; display:flex; align-items:center; justify-content:space-between;}
  .next .lbl{color:var(--mute); font-size:13px;}
  .next .val{font-size:22px; font-weight:800; color:var(--accent); font-variant-numeric:tabular-nums;}
  .planrow{margin-bottom:12px;}
  .tabs{display:flex; gap:8px; margin-bottom:14px;}
  .tab{flex:1; text-align:center; padding:11px 0; border-radius:12px; font-weight:700;
    background:var(--card); border:1px solid var(--line); color:var(--mute); cursor:pointer; user-select:none;}
  .tab.on{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  .tab small{display:block; font-weight:400; font-size:11px; margin-top:2px;}
  .ex{background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:12px 12px 10px; margin-bottom:12px; border-inline-start:3px solid var(--accent);}
  .ex h2{margin:0; font-size:16px;}
  .topline{display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .namewrap{display:flex; align-items:center; gap:7px; min-width:0;}
  .ib{flex:none; width:22px; height:22px; border-radius:50%; border:1px solid var(--line);
    background:#232529; color:var(--accent); font-size:12px; font-weight:800; cursor:pointer;
    font-style:italic; font-family:Georgia,serif; line-height:1; padding:0;}
  .rest-cfg{display:flex; align-items:center; gap:4px; color:var(--mute); font-size:12px; flex:none;}
  .rest-cfg input{width:44px; background:#232529; border:1px solid var(--line); border-radius:8px;
    color:var(--ink); font-size:13px; padding:4px 2px; text-align:center;}
  .ex .meta{color:var(--mute); font-size:12.5px; margin:3px 0 2px;}
  .ex .note{color:var(--mute); font-size:12.5px; margin:0 0 8px;}
  .ex .prev{font-size:12.5px; color:var(--ok); margin:0 0 8px; font-variant-numeric:tabular-nums;}
  .sets{display:flex; flex-direction:column; gap:6px;}
  .set{display:flex; align-items:center; gap:7px; border-radius:10px; padding:2px;}
  .set.done input{opacity:.55;}
  .set .n{width:18px; color:var(--mute); font-size:13px; text-align:center;}
  .set input{flex:1; min-width:0; background:#232529; border:1px solid var(--line); border-radius:10px;
    color:var(--ink); font-size:17px; padding:9px 6px; text-align:center; font-variant-numeric:tabular-nums;}
  .set input:focus{outline:none; border-color:var(--accent);}
  .set .u{color:var(--mute); font-size:11px; width:22px;}
  .chk{width:46px; height:42px; flex:none; border-radius:10px; border:1px solid var(--line);
    background:#232529; color:var(--mute); font-size:20px; font-weight:800; cursor:pointer;}
  .set.done .chk{background:var(--ok); border-color:var(--ok); color:#0c1a13;}
  .addset{margin-top:8px; background:none; border:1px dashed var(--line); color:var(--mute);
    border-radius:10px; padding:7px; width:100%; font-size:13px; cursor:pointer;}
  .restbar{position:fixed; bottom:76px; right:12px; left:12px; z-index:8;
    background:var(--accent); color:var(--accent-ink); border-radius:14px;
    padding:12px 16px; display:none; align-items:center; justify-content:space-between;
    font-weight:800; box-shadow:0 6px 24px rgba(0,0,0,.5);}
  .restbar.show{display:flex;}
  .restbar .t{font-size:26px; font-variant-numeric:tabular-nums;}
  .restbar .skip{font-size:13px; font-weight:700; background:rgba(0,0,0,.15); border:none;
    color:var(--accent-ink); border-radius:10px; padding:8px 14px; cursor:pointer;}
  .bar{position:fixed; bottom:0; right:0; left:0; display:flex; gap:10px;
    padding:12px; background:linear-gradient(transparent, var(--bg) 30%); z-index:7;}
  .btn{flex:1; padding:14px 0; border-radius:14px; border:none; font-size:16px; font-weight:800; cursor:pointer;}
  .btn.save{background:var(--accent); color:var(--accent-ink);}
  .btn.csv{background:var(--card); color:var(--ink); border:1px solid var(--line); flex:.55;}
  .toast{position:fixed; top:14px; right:50%; transform:translateX(50%);
    background:var(--ok); color:#0c1a13; font-weight:700; padding:10px 18px; border-radius:12px;
    opacity:0; transition:opacity .25s; pointer-events:none; z-index:9; max-width:88vw; text-align:center;}
  .toast.err{background:var(--danger); color:#fff;}
  .toast.show{opacity:1;}
  .count{color:var(--mute); font-size:12px; text-align:center; margin-top:4px;}
  /* history */
  .hist{background:var(--card); border:1px solid var(--line); border-radius:14px; margin-bottom:10px; padding:2px 12px;}
  .hist summary{padding:10px 0; cursor:pointer; display:flex; justify-content:space-between; align-items:center; list-style:none;}
  .hist summary::-webkit-details-marker{display:none;}
  .hist .hd{font-weight:700;}
  .hist .hm{color:var(--mute); font-size:12.5px;}
  .hist .body{padding:4px 0 10px; font-size:14px; color:var(--ink);}
  .hist .body div{margin:3px 0; font-variant-numeric:tabular-nums;}
  .hist .body b{font-weight:600;}
  .hist .del{color:var(--danger); background:none; border:none; font-size:12.5px; padding:6px 0; cursor:pointer;}
  /* settings / editor */
  .sec{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:12px;}
  .sec h3{margin:0 0 10px; font-size:15px;}
  .sec .row{display:flex; gap:8px; margin-bottom:8px;}
  .sbtn{background:#232529; border:1px solid var(--line); color:var(--ink); border-radius:11px;
    padding:11px 12px; font-size:14px; font-weight:700; cursor:pointer; width:100%;}
  .sbtn.warn{color:var(--danger);}
  .edx{border-top:1px solid var(--line); padding:9px 0;}
  .edx .row input{background:#232529; border:1px solid var(--line); border-radius:9px; color:var(--ink);
    font-size:14px; padding:8px 6px; min-width:0;}
  .edx .nm{flex:2.2;} .edx .sm{flex:.8; text-align:center;}
  .edx .delx{color:var(--danger); background:none; border:none; font-size:16px; cursor:pointer; flex:none; width:30px;}
  .hint{color:var(--mute); font-size:12.5px; margin:6px 0 0;}
  .hidden{display:none;}
  /* exercise info modal */
  .modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:20;
    display:none; align-items:flex-end; justify-content:center;}
  .modal-bg.show{display:flex;}
  .modal{background:var(--card); border:1px solid var(--line); border-bottom:none;
    border-radius:18px 18px 0 0; padding:16px 16px 22px; width:100%; max-width:560px;
    max-height:84vh; overflow-y:auto;}
  .modal h2{margin:0 0 3px; font-size:18px;}
  .modal .mus{color:var(--accent); font-size:13px; font-weight:600; margin:0 0 12px;}
  .modal .gifwrap{margin:0 0 12px;}
  .modal .gifwrap img{width:100%; max-height:46vh; object-fit:contain; border-radius:12px;
    background:#fff; display:block;}
  .modal .desc{color:var(--ink); font-size:14px; line-height:1.55; margin:0 0 14px; white-space:pre-line;}
  .modal .links{display:flex; gap:8px; margin-bottom:14px;}
  .modal .links a{flex:1; text-align:center; background:#232529; border:1px solid var(--line);
    color:var(--ink); border-radius:11px; padding:10px 6px; font-size:13.5px; font-weight:700;
    text-decoration:none;}
  .modal .close{width:100%; background:var(--accent); color:var(--accent-ink); border:none;
    border-radius:12px; padding:12px 0; font-size:15px; font-weight:800; cursor:pointer;}
</style>
</head>
<body>
<h1>INTEL GYM · <b>Workout Tracker</b></h1>

<div class="viewtabs">
  <div class="vtab on" data-v="workout" onclick="setView('workout')">Workout</div>
  <div class="vtab" data-v="history" onclick="setView('history')">History</div>
  <div class="vtab" data-v="settings" onclick="setView('settings')">Manage</div>
</div>

<div id="view-workout">
  <div class="next">
    <span class="lbl" id="statusLbl">Next workout</span>
    <span class="val" id="statusVal">A</span>
  </div>
  <div class="planrow"><select id="planSel" onchange="switchPlan(this.value)"></select></div>
  <div class="tabs" id="tabs"></div>
  <div id="exercises"></div>
  <div class="count" id="count"></div>
</div>

<div id="view-history" class="hidden">
  <div id="histList"></div>
</div>

<div id="view-settings" class="hidden">
  <div class="sec">
    <h3>Workout Plans</h3>
    <div class="row"><select id="editPlanSel" onchange="renderEditor()"></select></div>
    <div id="editor"></div>
    <div class="row" style="margin-top:10px">
      <button class="sbtn" onclick="addRoutine()">+ Routine</button>
      <button class="sbtn" onclick="addPlan()">+ New Plan</button>
    </div>
  </div>
  <div class="sec">
    <h3>Data</h3>
    <div class="row">
      <button class="sbtn" onclick="exportCSV()">Export CSV</button>
      <button class="sbtn" onclick="exportJSON()">Backup JSON</button>
    </div>
    <div class="row">
      <button class="sbtn" onclick="document.getElementById('hevyFile').click()">Import Hevy CSV</button>
      <button class="sbtn" onclick="document.getElementById('jsonFile').click()">Restore JSON</button>
    </div>
    <input type="file" id="hevyFile" accept=".csv" class="hidden" onchange="importHevy(this.files[0])">
    <input type="file" id="jsonFile" accept=".json" class="hidden" onchange="importJSON(this.files[0])">
    <p class="hint">Backup JSON = all your data (plans + history). It is also the format the AI/MCP integration reads and updates.</p>
  </div>
</div>

<div class="restbar" id="restbar">
  <span>Rest</span>
  <span class="t" id="restT">1:30</span>
  <button class="skip" onclick="skipRest()">Skip</button>
</div>

<div class="bar" id="mainBar">
  <button class="btn save" onclick="saveWorkout()">Finish &amp; Save Workout</button>
  <button class="btn csv" onclick="exportCSV()">CSV</button>
</div>
<div class="toast" id="toast"></div>

<div class="modal-bg" id="infoBg" onclick="closeInfo(event)">
  <div class="modal">
    <h2 id="infoTitle"></h2>
    <div class="mus" id="infoMus"></div>
    <div class="gifwrap" id="infoGif"></div>
    <p class="desc" id="infoDesc"></p>
    <div class="links" id="infoLinks"></div>
    <button class="close" onclick="closeInfo()">Close</button>
  </div>
</div>

<script>
/* ---------- default data ----------
   Intentionally empty: no personal data ships with the app.
   Each user's plans + history live only in their own browser storage;
   existing data comes in via Manage → Restore JSON. */
const DEFAULT_PLANS = {
  "1": { name: "My Plan", routines: {
    A: { name: "", ex: [] },
  }},
};

/* ---------- exercise guide (English how-to + demo GIF) ----------
   GIFs are hotlinked from fitnessprogramer.com and load only when the
   info sheet is opened; if a GIF fails (offline / moved), the sheet
   falls back to the demo-search links. Keyed by normalized name. */
const GIF_BASE="https://fitnessprogramer.com/wp-content/uploads/2021/02/";
const EXERCISE_INFO={
  "bench press (dumbbell)":{m:"Chest · front delts · triceps",g:"Dumbbell-Press.gif",
    d:"Lie on a flat bench with a dumbbell in each hand at chest level.\nPress the dumbbells up until your arms are extended, then lower them slowly back to the sides of your chest.\nKeep your feet planted and your shoulder blades pinched back against the bench."},
  "incline db press":{m:"Upper chest · front delts · triceps",g:"Incline-Dumbbell-Press.gif",
    d:"Set the bench to a 30–45° incline and hold the dumbbells at shoulder level with a neutral-ish grip.\nPress up and slightly back until your arms are extended, then lower under control.\nStop the descent where your shoulders stay pain-free."},
  "dumbbell row":{m:"Lats · mid-back · biceps",g:"Dumbbell-Row.gif",
    d:"Support one hand and knee on a bench, back flat, dumbbell hanging in the other hand.\nPull the dumbbell to your hip, driving the elbow back — not out.\nLower slowly until your arm is fully stretched. Avoid twisting the torso."},
  "squat (barbell)":{m:"Quads · glutes · core",g:"BARBELL-SQUAT.gif",
    d:"Bar on your upper back, feet shoulder-width, toes slightly out.\nBrace your core and sit down between your hips until your thighs reach at least parallel.\nDrive up through mid-foot, knees tracking over the toes the whole way."},
  "pull up":{m:"Lats · upper back · biceps",g:"Pull-up.gif",
    d:"Hang from the bar with an overhand grip slightly wider than your shoulders.\nPull your chest toward the bar by driving the elbows down, then lower to a full hang under control.\nIf your shoulder complains, switch to Lat Pulldown."},
  "pull up (weighted)":{m:"Lats · upper back · biceps",g:"Pull-up.gif",
    d:"Same movement as a strict pull up, with extra weight on a dip belt (or a dumbbell between your feet).\nFull hang at the bottom, chest to the bar at the top, no swinging.\nAdd weight only when clean bodyweight reps are easy."},
  "hanging leg raise":{m:"Abs · hip flexors · grip",g:"Hanging-Leg-Raises.gif",
    d:"Hang from a bar with straight arms.\nRaise your legs (bent knees is fine to start) by curling the pelvis up — don't just swing the legs.\nLower slowly to a dead hang between reps."},
  "captain's chair leg raise":{m:"Abs · hip flexors",g:"Captains-Chair-Leg-Raise.gif",
    d:"Support yourself on your forearms in the captain's chair, back against the pad.\nRaise your knees toward your chest by curling the pelvis up, then lower slowly.\nNo hanging involved, so it is easy on the shoulders. No station? Lying bench leg raises 3×15."},
  "standing calf raise (barbell)":{m:"Calves",g:"Standing-Calf-Raise.gif",
    d:"Stand with the bar on your back, balls of your feet on a small block.\nRise as high as you can onto your toes, pause a second, then lower until you feel a full stretch.\nKeep your knees straight but not locked."},
  "calf press (machine)":{m:"Calves",g:"Leg-Press-Calf-Raise.gif",
    d:"On the leg-press machine, place the balls of your feet on the bottom edge of the platform.\nPush through your toes to full extension, pause, then let your heels come back for a deep stretch.\nKeep the movement slow — no bouncing."},
  "bulgarian split squat":{m:"Quads · glutes · balance",g:"Dumbbell-Bulgarian-Split-Squat.gif",
    d:"Stand a stride ahead of a bench and rest your back foot on it, dumbbells at your sides.\nLower straight down until your front thigh is about parallel, then drive up through the front heel.\nKeep your torso tall; do all reps on one leg, then switch."},
  "bulgarian split squat (dumbbell)":{m:"Quads · glutes · balance",g:"Dumbbell-Bulgarian-Split-Squat.gif",
    d:"Stand a stride ahead of a bench and rest your back foot on it, dumbbells at your sides.\nLower straight down until your front thigh is about parallel, then drive up through the front heel.\nKeep your torso tall; do all reps on one leg, then switch."},
  "shoulder press (dumbbell)":{m:"Shoulders · triceps",g:"Dumbbell-Shoulder-Press.gif",
    d:"Seated or standing, hold the dumbbells at shoulder height, palms forward or neutral.\nPress overhead until your arms are extended without shrugging, then lower to ear level.\nKeep your ribs down and core braced — don't arch the lower back."},
  "lateral raise (dumbbell)":{m:"Side delts",g:"Dumbbell-Lateral-Raise.gif",
    d:"Stand with dumbbells at your sides, slight bend in the elbows.\nRaise your arms out to the sides up to shoulder height, leading with the elbows.\nLower slowly — lighter and cleaner beats heavier and swingy."},
  "bicep curl (dumbbell)":{m:"Biceps · forearms",g:"Dumbbell-Curl.gif",
    d:"Stand tall, dumbbells at your sides, palms forward.\nCurl the weight up without moving your upper arms, squeeze at the top, then lower slowly.\nNo swinging from the hips."},
  "db bicep curl":{m:"Biceps · forearms",g:"Dumbbell-Curl.gif",
    d:"Stand tall, dumbbells at your sides, palms forward.\nCurl the weight up without moving your upper arms, squeeze at the top, then lower slowly.\nNo swinging from the hips."},
  "triceps extension (dumbbell)":{m:"Triceps",g:"Dumbbell-Triceps-Extension.gif",
    d:"Hold one dumbbell overhead with both hands, elbows pointing forward.\nLower the weight behind your head by bending the elbows, then extend back up.\nKeep the upper arms still — only the forearms move."},
  "triceps pushdown":{m:"Triceps",g:"Pushdown.gif",
    d:"Stand at a cable stack with the bar or rope at chest height, elbows tucked to your sides.\nPush the handle down until your arms are fully extended, squeeze, then let it rise to elbow height.\nElbows stay glued to your ribs the whole set."},
  "seated leg curl":{m:"Hamstrings",g:"Seated-Leg-Curl.gif",
    d:"Sit with the pad on the back of your ankles, thighs secured.\nCurl your heels under the seat as far as they go, pause, then release slowly.\nThe slow negative is where the hamstrings do their work."},
  "seated leg curl (machine)":{m:"Hamstrings",g:"Seated-Leg-Curl.gif",
    d:"Sit with the pad on the back of your ankles, thighs secured.\nCurl your heels under the seat as far as they go, pause, then release slowly.\nThe slow negative is where the hamstrings do their work."},
  "leg extension (machine)":{m:"Quads",g:"LEG-EXTENSION.gif",
    d:"Sit with the pad on your shins, knees lined up with the machine's pivot.\nExtend your legs until your knees are straight, squeeze the quads, then lower under control.\nDon't let the stack slam between reps."},
  "leg press (machine)":{m:"Quads · glutes · hamstrings",g:"Leg-Press.gif",
    d:"Feet shoulder-width on the platform, lower back pressed into the pad.\nLower the sled until your knees are near your chest without your hips curling off the seat.\nPress back up through the whole foot without locking the knees hard."},
  "leg press (plate-loaded)":{m:"Quads · glutes · hamstrings",g:"Leg-Press.gif",
    d:"Feet shoulder-width on the platform, lower back pressed into the pad.\nLower the sled through a full range — knees toward your chest, hips staying on the seat.\nPress back up through the whole foot without locking the knees hard."},
  "v-squat (hammer)":{m:"Quads · glutes",g:"Hack-Squat.gif",
    d:"Stand in the V-squat / hack machine with your back and hips flat against the pad.\nUnlock and squat down until your thighs reach about parallel, knees tracking over the toes.\nDrive up through mid-foot. Weight = plates loaded. Smith-machine squat is the backup option."},
  "iso row (plate-loaded)":{m:"Lats · mid-back · biceps",g:"Lever-Seated-Row.gif",
    d:"Sit with your chest against the pad and grab the handles.\nPull toward your hips, driving the elbows back and squeezing the shoulder blades together.\nRelease slowly to a full stretch. Weight = plates per side."},
  "seated cable row":{m:"Mid-back · lats · biceps",g:"Seated-Cable-Row.gif",
    d:"Sit tall, feet braced, and grab the handle with arms extended.\nPull to your stomach with shoulders down and back, chest proud.\nLet the weight stretch you forward slowly between reps — no slouching."},
  "back extension":{m:"Lower back · glutes · hamstrings",g:"Hyperextension.gif",
    d:"Set the pad at your hips on the 45° bench, ankles locked in.\nLower your torso with a straight back, then raise up until your body forms a straight line — no hyperextending.\nHold a plate to your chest once bodyweight is easy."},
  "reverse fly (machine)":{m:"Rear delts · upper back",g:"Machine-Reverse-Fly.gif",
    d:"Sit facing the machine's pad, arms forward on the handles.\nSweep your arms out and back in a wide arc until they are in line with your shoulders.\nLight weight, strict form — this one is for shoulder health."},
  "chest press (machine)":{m:"Chest · front delts · triceps",g:"Lever-Chest-Press.gif",
    d:"Adjust the seat so the handles sit at mid-chest level.\nPress forward until your arms are extended, then return until you feel a comfortable stretch.\nIf it bothers your shoulder, switch to the alternate (yellow) machine."},
};
function findInfo(name){
  const n=norm(name);
  if(EXERCISE_INFO[n]) return EXERCISE_INFO[n];
  const stripped=n.replace(/\(.*?\)/g," ").replace(/\s+/g," ").trim();
  if(EXERCISE_INFO[stripped]) return EXERCISE_INFO[stripped];
  for(const k in EXERCISE_INFO){
    const ks=k.replace(/\(.*?\)/g," ").replace(/\s+/g," ").trim();
    if(ks===stripped||ks.includes(stripped)||stripped.includes(ks)) return EXERCISE_INFO[k];
  }
  return null;
}
function showInfo(name){
  const info=findInfo(name);
  $("infoTitle").textContent=name;
  $("infoMus").textContent=info?info.m:"";
  $("infoDesc").textContent=info?info.d:"No guide for this exercise yet — use the demo links below.";
  $("infoLinks").innerHTML=
    `<a href="https://www.youtube.com/results?search_query=${encodeURIComponent(name+" exercise form")}" target="_blank" rel="noopener">▶ Video demos</a>`+
    `<a href="https://www.google.com/search?udm=2&q=${encodeURIComponent(name+" exercise gif")}" target="_blank" rel="noopener">🔎 More GIFs</a>`;
  const wrap=$("infoGif"); wrap.innerHTML="";
  if(info&&info.g){
    const img=new Image();
    img.referrerPolicy="no-referrer"; img.alt=name+" demonstration";
    img.onerror=()=>{ wrap.innerHTML='<p class="hint" style="text-align:center;padding:8px 0">GIF could not load (offline?) — use the demo links below.</p>'; };
    img.src=info.g.startsWith("http")?info.g:GIF_BASE+info.g;
    wrap.appendChild(img);
  }
  $("infoBg").classList.add("show");
}
function closeInfo(ev){
  if(ev&&ev.target!==$("infoBg")) return; /* backdrop click only */
  $("infoBg").classList.remove("show");
  $("infoGif").innerHTML=""; /* stop the gif when closed */
}

/* ---------- storage adapter: Claude artifact OR standalone ---------- */
const IS_CLAUDE = typeof window.storage !== "undefined";
const store = {
  async get(k){
    if(IS_CLAUDE){ try{ const r=await window.storage.get(k); return r&&r.value?JSON.parse(r.value):null; }catch(e){ return null; } }
    try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }
    catch(e){
      /* corrupt value: keep the raw blob recoverable instead of letting callers overwrite it */
      try{ const v=localStorage.getItem(k); if(v) localStorage.setItem(k+"-corrupt-"+Date.now(), v); }catch(_){}
      return null;
    }
  },
  async set(k,v){
    if(IS_CLAUDE){ try{ const r=await window.storage.set(k, JSON.stringify(v)); return !!r; }catch(e){ return false; } }
    try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; }
  },
  async del(k){
    if(IS_CLAUDE){ try{ await window.storage.delete(k); }catch(e){} return; }
    try{ localStorage.removeItem(k); }catch(e){}
  }
};
const DATA="gym-data-v3", LOG="gym-log-v1", DRAFT="gym-draft-v1", REST="gym-rest-v1";

/* ---------- state ---------- */
let plans={}, activePlan="1", restCfg={}, history=[];
let session={plan:null, routine:null, start:null, state:{}};
let currentRoutine="A", restEnd=null, restDone=false, view="workout";

const $=id=>document.getElementById(id);
function toast(msg, err){
  const t=$("toast"); t.textContent=msg; t.className="toast show"+(err?" err":"");
  setTimeout(()=>t.className="toast"+(err?" err":""), 2600);
}
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
/* for strings inside single-quoted JS string literals in inline handlers */
const jsq=s=>String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/"/g,"\\x22").replace(/</g,"\\x3c");
const norm=s=>String(s).trim().toLowerCase();

/* ---------- init ---------- */
async function init(){
  const data=await store.get(DATA);
  if(data){ plans=data.plans; activePlan=data.activePlan; restCfg=data.restCfg||{}; }
  else{
    plans=DEFAULT_PLANS;
    restCfg=(await store.get(REST))||{};
    await store.set(DATA,{plans,activePlan,restCfg});
  }
  if(!plans||!Object.keys(plans).length) plans=DEFAULT_PLANS;
  if(!plans[activePlan]) activePlan=Object.keys(plans).sort()[0];
  history=(await store.get(LOG))||[];
  /* deterministic fallback for pre-plan-era entries: same stamp on every launch */
  const legacyPlan=Object.keys(plans).sort()[0];
  history.forEach(h=>{ if(!h.plan) h.plan=legacyPlan; });
  const d=await store.get(DRAFT);
  if(d && d.start && plans[d.plan] && plans[d.plan].routines[d.routine]){
    session=d; activePlan=d.plan; currentRoutine=d.routine; toast("Open workout restored");
  }
  else{
    if(d) store.del(DRAFT); /* draft references a plan/routine that no longer exists */
    currentRoutine=nextRoutine();
  }
  renderWorkout(); updateStatus();
  setInterval(tick, 500);
  if("serviceWorker" in navigator && location.protocol.startsWith("http"))
    navigator.serviceWorker.register("sw.js").catch(()=>{});
}
function persistData(){ store.set(DATA,{plans,activePlan,restCfg}); }
function routineKeys(p){ return Object.keys(plans[p].routines).sort(); }
function firstRoutine(){ return routineKeys(activePlan)[0]; }
function nextRoutine(){
  const keys=routineKeys(activePlan);
  for(let i=history.length-1;i>=0;i--){
    const h=history[i];
    if(h.plan===activePlan && keys.includes(h.routine))
      return keys[(keys.indexOf(h.routine)+1)%keys.length];
  }
  return keys[0];
}
function lastEntry(name){
  const n=norm(name);
  for(let i=history.length-1;i>=0;i--){
    const e=(history[i].entries||[]).find(x=>norm(x.name)===n);
    if(e) return {date:history[i].date, sets:e.sets};
  }
  return null;
}

/* ---------- views ---------- */
function setView(v){
  view=v;
  document.querySelectorAll(".vtab").forEach(t=>t.classList.toggle("on",t.dataset.v===v));
  $("view-workout").classList.toggle("hidden",v!=="workout");
  $("view-history").classList.toggle("hidden",v!=="history");
  $("view-settings").classList.toggle("hidden",v!=="settings");
  $("mainBar").style.display = v==="workout" ? "flex" : "none";
  if(v==="history") renderHistory();
  if(v==="settings"){ renderPlanSelects(); renderEditor(); }
  window.scrollTo(0,0);
}

/* ---------- workout view ---------- */
function renderPlanSelects(){
  const opts=Object.keys(plans).map(p=>`<option value="${p}">${esc(plans[p].name)}</option>`).join("");
  $("planSel").innerHTML=opts; $("planSel").value=activePlan;
  const cur=$("editPlanSel").value; /* innerHTML reset auto-selects option 1 — keep the user's pick */
  $("editPlanSel").innerHTML=opts;
  $("editPlanSel").value=plans[cur]?cur:activePlan;
}
function switchPlan(p){
  if(session.start){ $("planSel").value=activePlan; toast("Finish or save the open workout first", true); return; }
  activePlan=p; session={plan:null,routine:null,start:null,state:{}};
  currentRoutine=nextRoutine(); persistData(); renderWorkout(); updateStatus();
}
function stateKey(r,i){ return r+"|"+i; }
function getState(r,i,ex){
  const k=stateKey(r,i);
  if(!session.state[k]){
    const prev=lastEntry(ex.n);
    const n=prev?prev.sets.length:ex.sets;
    const sets=[];
    for(let j=0;j<n;j++){
      const p=prev?prev.sets[j]:null;
      sets.push({w:p?p.w:ex.w, r:p&&p.r!==""?p.r:ex.rep, done:false});
    }
    session.state[k]={sets};
  }
  return session.state[k];
}
function restFor(ex){ return restCfg[norm(ex.n)]||ex.rest||90; }

function renderWorkout(){
  renderPlanSelects();
  const rKeys=routineKeys(activePlan);
  if(!rKeys.length){
    $("tabs").innerHTML="";
    $("exercises").innerHTML='<p class="hint" style="text-align:center;padding:18px 8px">This plan has no routines yet — add one in <b>Manage → Workout Plans</b>.</p>';
    $("count").textContent="";
    return;
  }
  if(!rKeys.includes(currentRoutine)) currentRoutine=rKeys[0];
  $("tabs").innerHTML=rKeys.map(r=>
    `<div class="tab ${r===currentRoutine?"on":""}" onclick="switchTab('${jsq(r)}')">${esc(r)}<small>${esc(plans[activePlan].routines[r].name||"")}</small></div>`
  ).join("");
  $("exercises").innerHTML=plans[activePlan].routines[currentRoutine].ex.map((ex,xi)=>{
    const st=getState(currentRoutine,xi,ex);
    const prev=lastEntry(ex.n);
    const prevTxt=prev
      ? "Last time ("+prev.date.slice(5).replace("-",".")+"): "+prev.sets.map(s=>(s.w||"BW")+"×"+s.r).join(", ")
      : "First workout — suggested weight: "+(ex.w||"bodyweight");
    const rows=st.sets.map((s,i)=>`
      <div class="set ${s.done?"done":""}" id="row-${xi}-${i}">
        <span class="n">${i+1}</span>
        <input type="number" inputmode="decimal" step="0.5" placeholder="weight" value="${s.w}" oninput="upd(${xi},${i},'w',this.value)">
        <span class="u">kg</span>
        <input type="number" inputmode="numeric" placeholder="reps" value="${s.r}" oninput="upd(${xi},${i},'r',this.value)">
        <button class="chk" onclick="toggleDone(${xi},${i})">✓</button>
      </div>`).join("");
    return `<div class="ex">
      <div class="topline">
        <div class="namewrap"><h2>${esc(ex.n)}</h2><button class="ib" onclick="showInfo('${jsq(ex.n)}')" title="How to do this exercise">i</button></div>
        <span class="rest-cfg">Rest <input type="number" inputmode="numeric" value="${restFor(ex)}" onchange="setRestCfg(${xi},this.value)"> s</span>
      </div>
      <div class="meta">${ex.sets}×${esc(ex.reps)}</div>
      ${ex.note?`<div class="note">${esc(ex.note)}</div>`:""}
      <div class="prev">${prevTxt}</div>
      <div class="sets">${rows}</div>
      <button class="addset" onclick="addSet(${xi})">+ Set</button>
    </div>`;
  }).join("")||'<p class="hint" style="text-align:center;padding:18px 8px">No exercises in this routine yet.<br>Add them in <b>Manage → Workout Plans</b>, or restore an existing JSON backup.</p>';
  $("count").textContent=history.length?history.length+" workouts saved":"";
}
function switchTab(r){ currentRoutine=r; renderWorkout(); window.scrollTo(0,0); }
function exAt(xi){ return plans[activePlan].routines[currentRoutine].ex[xi]; }
function upd(xi,i,f,v){ getState(currentRoutine,xi,exAt(xi)).sets[i][f]=v; persistDraft(); }
function setRestCfg(xi,v){ restCfg[norm(exAt(xi).n)]=Math.max(10,parseInt(v)||60); persistData(); }
function toggleDone(xi,i){
  const ex=exAt(xi), st=getState(currentRoutine,xi,ex), s=st.sets[i];
  s.done=!s.done;
  $("row-"+xi+"-"+i).classList.toggle("done",s.done);
  if(s.done){
    if(!session.start){ session.start=Date.now(); session.plan=activePlan; session.routine=currentRoutine; updateStatus(); }
    startRest(restFor(ex));
  }
  persistDraft();
}
function addSet(xi){
  const ex=exAt(xi), st=getState(currentRoutine,xi,ex);
  const last=st.sets[st.sets.length-1];
  st.sets.push({w:last?last.w:ex.w, r:ex.rep, done:false});
  persistDraft(); renderWorkout();
}
let draftTimer=null;
function persistDraft(){
  if(!session.start) return;
  clearTimeout(draftTimer);
  draftTimer=setTimeout(()=>store.set(DRAFT,session), 600);
}
function startRest(sec){ restEnd=Date.now()+sec*1000; restDone=false; $("restbar").classList.add("show"); }
function skipRest(){ restEnd=null; $("restbar").classList.remove("show"); }
function beep(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    [0,0.25].forEach(t=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value=880; g.gain.value=0.25;
      o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+0.15);
    });
  }catch(e){}
}
function fmt(ms){ const s=Math.max(0,Math.ceil(ms/1000)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function updateStatus(){
  if(session.start){ $("statusLbl").textContent="Workout "+(session.routine||currentRoutine)+" in progress"; }
  else{ $("statusLbl").textContent="Next workout"; $("statusVal").textContent=nextRoutine(); }
}
function tick(){
  if(session.start) $("statusVal").textContent=fmt(Date.now()-session.start);
  if(restEnd){
    const left=restEnd-Date.now();
    $("restT").textContent=fmt(left);
    if(left<=0 && !restDone){
      restDone=true; beep();
      if(navigator.vibrate) navigator.vibrate([200,100,200]);
      setTimeout(skipRest, 1500);
    }
  }
}
async function saveWorkout(){
  const entries=[];
  plans[activePlan].routines[currentRoutine].ex.forEach((ex,xi)=>{
    const st=session.state[stateKey(currentRoutine,xi)];
    if(!st) return;
    const sets=st.sets.filter(s=>s.done&&s.r!=="").map(s=>({w:s.w,r:s.r}));
    if(sets.length) entries.push({name:ex.n, sets});
  });
  if(!entries.length){ toast("Check off ✓ at least one set", true); return; }
  const d=new Date();
  const date=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const dur=session.start?Math.max(1,Math.round((Date.now()-session.start)/60000)):"";
  history.push({date, plan:activePlan, routine:currentRoutine, duration_min:dur, entries});
  const ok=await store.set(LOG,history);
  if(!ok){ history.pop(); toast("Save failed — the workout is still here, try again", true); return; }
  await store.del(DRAFT);
  session={plan:null,routine:null,start:null,state:{}};
  skipRest();
  toast("Saved"+(dur?" · "+dur+" min":""));
  currentRoutine=nextRoutine();
  renderWorkout(); updateStatus();
}

/* ---------- history view ---------- */
function renderHistory(){
  if(!history.length){ $("histList").innerHTML='<p class="hint">No workouts yet.</p>'; return; }
  $("histList").innerHTML=history.slice().reverse().map((h,ri)=>{
    const idx=history.length-1-ri;
    const planName=plans[h.plan]?plans[h.plan].name:(h.plan==="hevy"?"Hevy import":h.plan);
    const nSets=h.entries.reduce((a,e)=>a+e.sets.length,0);
    const body=h.entries.map(e=>`<div><b>${esc(e.name)}</b>: ${e.sets.map(s=>(s.w||"BW")+"×"+s.r).join(", ")}</div>`).join("");
    return `<details class="hist">

      </div>

async function delWorkout(idx){
  if(!confirm("Delete this workout?")) return;
  history.splice(idx,1);
  await store.set(LOG,history);
  renderHistory(); toast("Deleted");
}

/* ---------- editor ---------- */
function renderEditor(){
  const p=$("editPlanSel").value||activePlan;
  const plan=plans[p]; if(!plan){ $("editor").innerHTML=""; return; }
  let html=`<div class="row"><input class="nm" style="flex:1;background:#232529;border:1px solid var(--line);border-radius:9px;color:var(--ink);padding:8px" value="${esc(plan.name)}" onchange="plans['${jsq(p)}'].name=this.value;persistData();renderPlanSelects()"></div>`;
  routineKeys(p).forEach(r=>{
    const rt=plan.routines[r];
    html+=`<h3 style="margin:12px 0 4px;display:flex;align-items:center">${esc(r)} · <input style="background:none;border:none;color:var(--accent);font-size:15px;font-weight:700;width:100px;flex:1" value="${esc(rt.name||"")}" onchange="plans['${jsq(p)}'].routines['${jsq(r)}'].name=this.value;persistData()"><button class="delx" onclick="delRoutine('${jsq(p)}','${jsq(r)}')" title="Delete routine">✕</button></h3>`;
    rt.ex.forEach((ex,i)=>{
      html+=`<div class="edx">
        <div class="row">
          <input class="nm" value="${esc(ex.n)}" onchange="edEx('${jsq(p)}','${jsq(r)}',${i},'n',this.value)">
          <button class="delx" onclick="delEx('${jsq(p)}','${jsq(r)}',${i})">✕</button>
        </div>
        <div class="row">
          <input class="sm" type="number" value="${ex.sets}" onchange="edEx('${jsq(p)}','${jsq(r)}',${i},'sets',parseInt(this.value)||3)" title="Sets">
          <input class="sm" value="${esc(ex.reps)}" onchange="edEx('${jsq(p)}','${jsq(r)}',${i},'reps',this.value)" title="Reps">
          <input class="sm" type="number" step="0.5" value="${ex.w}" onchange="edEx('${jsq(p)}','${jsq(r)}',${i},'w',parseFloat(this.value)||0)" title="Weight">
          <input class="sm" type="number" value="${ex.rest}" onchange="edEx('${jsq(p)}','${jsq(r)}',${i},'rest',parseInt(this.value)||60)" title="Rest">
        </div>
      </div>`;
    });
    html+=`<button class="sbtn" style="margin-top:6px" onclick="addEx('${jsq(p)}','${jsq(r)}')">+ Exercise in ${esc(r)}</button>`;
  });
  html+=`<p class="hint">Second-row fields: sets · reps · weight · rest (s)</p>`;
  $("editor").innerHTML=html;
}
function edEx(p,r,i,f,v){ plans[p].routines[r].ex[i][f]=v; if(f==="reps"){ const m=String(v).match(/\d+/); if(m) plans[p].routines[r].ex[i].rep=parseInt(m[0]); } persistData(); }
function delEx(p,r,i){ if(!confirm("Delete this exercise?")) return; plans[p].routines[r].ex.splice(i,1); persistData(); renderEditor(); }
function addEx(p,r){ plans[p].routines[r].ex.push({n:"New Exercise",sets:3,reps:"10",w:20,rep:10,rest:60,note:""}); persistData(); renderEditor(); }
function addRoutine(){
  const p=$("editPlanSel").value||activePlan;
  const name=prompt("Name of the new routine (e.g. Push):","");
  if(name===null) return;
  /* letters already used in this plan's history stay reserved — reusing one
     would re-attribute the old routine's workouts to the new routine */
  const used=new Set(routineKeys(p));
  history.forEach(h=>{ if(h.plan===p && h.routine) used.add(h.routine); });
  let letter=null;
  for(let i=0;i<26;i++){ const c=String.fromCharCode(65+i); if(!used.has(c)){ letter=c; break; } }
  if(!letter){ toast("Can't add — all letters are taken (including letters with history)", true); return; }
  plans[p].routines[letter]={name:name.trim(), ex:[]};
  persistData(); renderEditor();
  if(p===activePlan){
    if(!session.start) currentRoutine=letter;
    renderWorkout(); updateStatus();
  }
  toast("Added routine "+letter+(name.trim()?" · "+name.trim():""));
}
function delRoutine(p,r){
  const rt=plans[p].routines[r]; if(!rt) return;
  if(routineKeys(p).length<=1){ toast("Can't delete the last routine in a plan", true); return; }
  if(session.start && p===activePlan){ toast("A workout is open — finish it before deleting routines", true); return; }
  if(!confirm("Delete routine "+r+(rt.name?" ("+rt.name+")":"")+" and its "+rt.ex.length+" exercises? History is kept.")) return;
  delete plans[p].routines[r];
  persistData(); renderEditor();
  if(p===activePlan){
    Object.keys(session.state).forEach(k=>{ if(k.startsWith(r+"|")) delete session.state[k]; });
    if(currentRoutine===r) currentRoutine=firstRoutine();
    renderWorkout(); updateStatus();
  }
  toast("Routine "+r+" deleted");
}
function addPlan(){
  const name=prompt("New plan name:","Routine "+(Object.keys(plans).length+1));
  if(!name) return;
  const id="p"+Date.now();
  plans[id]={name, routines:{A:{name:"", ex:[]}}};
  persistData(); renderPlanSelects(); $("editPlanSel").value=id; renderEditor();
}

/* ---------- import / export ---------- */
function download(blob, fname){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=fname;
  document.body.appendChild(a); a.click(); a.remove();
}
async function shareOrDownload(blob, fname, mime){
  const file=new File([blob], fname, {type:mime});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:fname}); return; }catch(e){ if(e.name==="AbortError") return; }
  }
  download(blob, fname);
}
async function exportCSV(){
  if(!history.length){ toast("No workouts to export", true); return; }
  let csv="Date,Plan,Workout,Duration_min,Exercise,Set,Weight_kg,Reps\n";
  history.forEach(w=>w.entries.forEach(e=>e.sets.forEach((s,i)=>{
    const planName=plans[w.plan]?plans[w.plan].name:w.plan;
    csv+=`${w.date},"${planName}",${w.routine},${w.duration_min||""},"${e.name}",${i+1},${s.w||0},${s.r}\n`;
  })));
  await shareOrDownload(new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"}), "workouts.csv", "text/csv");
}
async function exportJSON(){
  const dump={version:3, exported:new Date().toISOString(), plans, activePlan, restCfg, history};
  await shareOrDownload(new Blob([JSON.stringify(dump,null,2)],{type:"application/json"}), "gym-backup.json", "application/json");
}
function importJSON(file){
  if(!file) return;
  const fr=new FileReader();
  fr.onload=async()=>{
    try{
      const d=JSON.parse(fr.result);
      const plansOk = d && d.plans && typeof d.plans==="object" && Object.keys(d.plans).length>0
        && Object.values(d.plans).every(pl=>pl && pl.routines && typeof pl.routines==="object"
             && Object.keys(pl.routines).length>0 && Object.values(pl.routines).every(rt=>rt && Array.isArray(rt.ex)));
      if(!plansOk || !Array.isArray(d.history)) throw new Error();
      if(!confirm("Restore from this backup? It replaces all current data"+(session.start?" and discards the open workout":"")+".")) return;
      plans=d.plans;
      activePlan=(d.activePlan && plans[d.activePlan])?d.activePlan:Object.keys(plans).sort()[0];
      restCfg=d.restCfg||{}; history=d.history;
      /* the old session/draft describes plans that no longer exist — drop them */
      session={plan:null,routine:null,start:null,state:{}};
      await store.del(DRAFT); skipRest();
      await store.set(DATA,{plans,activePlan,restCfg});
      await store.set(LOG,history);
      currentRoutine=nextRoutine();
      toast("Restored: "+history.length+" workouts");
      renderPlanSelects(); renderEditor(); renderWorkout(); updateStatus();
    }catch(e){ toast("Invalid file", true); }
  };
  fr.readAsText(file);
}
function splitCSV(line){
  const out=[]; let cur="", q=false;
  for(const ch of line){
    if(ch==='"'){ q=!q; continue; }
    if(ch===','&&!q){ out.push(cur); cur=""; continue; }
    cur+=ch;
  }
  out.push(cur); return out;
}
function importHevy(file){
  if(!file) return;
  const fr=new FileReader();
  fr.onload=async()=>{
    try{
      const lines=fr.result.split(/\r?\n/).filter(l=>l.trim());
      const head=splitCSV(lines[0]).map(h=>h.trim().toLowerCase());
      const ix={
        title:head.indexOf("title"), start:head.indexOf("start_time"),
        ex:head.indexOf("exercise_title"), w:head.indexOf("weight_kg"), r:head.indexOf("reps")
      };
      if(ix.ex<0||ix.r<0) throw new Error();
      const groups={};
      for(let i=1;i<lines.length;i++){
        const c=splitCSV(lines[i]);
        const raw=ix.start>=0?c[ix.start]:"";
        let date=raw;
        const dt=new Date(raw);
        if(!isNaN(dt)) date=dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
        const key=(ix.title>=0?c[ix.title]:"Hevy")+"|"+raw;
        if(!groups[key]) groups[key]={date, plan:"hevy", routine:(ix.title>=0?c[ix.title]:"Hevy"), duration_min:"", entries:[]};
        const g=groups[key];
        const name=c[ix.ex]; if(!name) continue;
        let e=g.entries.find(x=>x.name===name);
        if(!e){ e={name, sets:[]}; g.entries.push(e); }
        const reps=c[ix.r]; if(reps==="") continue;
        e.sets.push({w:ix.w>=0?(c[ix.w]||0):0, r:reps});
      }
      const imported=Object.values(groups).filter(g=>g.entries.length);
      if(!imported.length) throw new Error();
      history=history.concat(imported).sort((a,b)=>a.date<b.date?-1:1);
      const ok=await store.set(LOG,history);
      if(!ok) throw new Error();
      toast("Imported "+imported.length+" workouts from Hevy");
      renderWorkout();
    }catch(e){ toast("Import failed — make sure this is a Hevy export file", true); }
  };
  fr.readAsText(file);
}

init();
</script>
